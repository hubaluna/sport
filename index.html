 bandPull:{name:'Тяга резинки зверху до грудей',category:'Тяга · спина',muscles:'Найширші м’язи спини, біцепси; контроль лопаток.',why:'Додає невеликий обсяг вертикальної тяги для підтягувань без роботи до відмови.',setup:'Перекладина і ціла резинка-петля. Перед рухом перевір надійність перекладини й кріплення.',steps:['Закріпи петлю резинки на перекладині над головою. Візьми нижні частини петлі двома руками; у замкненої резинки немає вільних кінців.','Стань на коліна під точкою кріплення або трохи позаду неї. Живіт злегка напружений, ребра не випинаються.','Почни з піднятих рук. На видиху плавно веди лікті вниз і назад до боків тулуба, а кисті — до рівня верхньої частини грудей.','Не тягни резинку за голову. Плечі тримай подалі від вух; не допомагай руху розгойдуванням корпусу.','На вдиху повільно поверни руки вгору. Один рух униз і повернення — одне повторення.'],tempo:'Приблизно 1–2 с тяга та 2 с повернення.',mistakes:['Прогинати поперек і випинати ребра.','Тягнути прямими руками, як у пуловері — тут лікті згинаються.','Піднімати плечі до вух або смикати резинку.'],easier:'Якщо товста резинка надто туга, використовуй зручніший хват і менший натяг. Якщо плавна тяга неможлива — пропусти опціональний блок; не змінюй кріплення під навантаженням.',video:{url:'https://www.youtube.com/watch?v=gebMl23Fw_4',title:'How to do a kneeling lat pull down with a band',credit:'Демонстрація тяги з резинкою',note:'У відео точка кріплення може відрізнятися. У твоєму варіанті резинка кріпиться до надійної перекладини.'},query:'kneeling resistance band lat pulldown proper form'},
 bridge:{name:'Сідничний міст',category:'Ноги · таз',muscles:'Сідничні м’язи, задня поверхня стегна; стабілізація тулуба.',why:'Тренує розгинання стегна й контроль таза для присідань та приземлень.',setup:'Ляж на спину на неслизьку поверхню; стопи не ковзають.',steps:['Зігни коліна й постав стопи на підлогу приблизно на ширині таза. Руки лежать уздовж тіла.','Злегка напруж живіт. Відштовхнися стопами від підлоги й стискай сідниці, щоб підняти таз.','Зупинися, коли плечі, таз і коліна утворять приблизно пряму лінію. Не піднімайся вище за рахунок попереку.','Затримайся на 1 с, продовжуючи спокійно дихати.','Повільно опусти таз на підлогу. Підйом і опускання — одне повторення.'],tempo:'1–2 с угору → 1 с пауза → 2 с униз.',mistakes:['Закидати голову й тиснути на шию.','Зводити коліна всередину.','Виконувати рух переважно прогином попереку.'],easier:'Зменш висоту підйому. Якщо зводить задню поверхню стегна, зупинись і підбери комфортніше положення стоп.',video:{url:'https://www.youtube.com/watch?v=q_efzt0KPsw',title:'Bridge — exercise demonstration',credit:'Peak Physio',source:'https://www.peak-physio.com.au/exercise/bridge/'},query:'glute bridge bodyweight physiotherapy technique'},
 push:{name:'Віджимання',category:'Жим · груди й руки',muscles:'Грудні м’язи, трицепси, передня частина плечей; стабілізація кора.',why:'Розвиває силу жиму та витривалість для 50 віджимань у фінальному комплексі.',setup:'Долоні трохи ширше за плечі, пальці вперед або трохи назовні; тіло рівне.',steps:['Прийми упор лежачи, напруж живіт і сідниці. Таз не провисає.','На вдиху згинай лікті під комфортним кутом до тулуба, без надмірного розведення вбік.','Опусти груди близько до підлоги; голова залишається продовженням спини.','На видиху відштовхни підлогу й розігни лікті. Усе тіло рухається разом.','У комплексі можна робити 6+4 або 5+5. Спочатку заверши потрібні повторення віджимань, потім переходь далі.'],tempo:'Контрольоване опускання й рівний підйом; у повільному варіанті опускання 3 с.',mistakes:['Провалювати таз або піднімати груди раніше за таз.','Скорочувати амплітуду через втому.','Витягувати шию до підлоги.'],easier:'Віджимайся біля стіни або від стійкої підвищеної опори. У комплексі познач це як полегшення.',video:{url:'https://www.youtube.com/watch?v=0pkjOk0EiAk',title:'The Push-Up',credit:'CrossFit'},query:'push up proper form beginner CrossFit'},
 slowPush:{name:'Повільні віджимання',category:'Жим · окрема сила',muscles:'Грудні м’язи, трицепси, плечі та кор.',why:'Окремий силовий блок жиму поза комплексом; допомагає контролювати опускання.',setup:'Той самий упор, що у звичайних віджиманнях. Обери варіант, у якому лишаються 2 повторення в запасі.',steps:['Напруж живіт і сідниці, вирівняй тіло.','Плавно опускайся приблизно 3 с: подумки «один — два — три».','Зупинися у нижній точці без відпочинку на підлозі.','Піднімайся контрольовано, без ривка чи хвилі тулубом.','Заверши підхід із запасом щонайменше 2 повторень. Після комплексу цей блок можна пропустити.'],tempo:'3 с униз, звичайний контрольований підйом, 90 с між підходами.',mistakes:['Прискорювати опускання на останніх повтореннях.','Працювати до відмови після виснажливого комплексу.'],easier:'Стійка підвищена опора або стіна; якщо не вдається зберегти техніку — пропусти опціональний блок.',video:{url:'https://www.youtube.com/watch?v=0pkjOk0EiAk',title:'The Push-Up',credit:'CrossFit',note:'Ролик показує базову техніку. У твоєму повільному варіанті опускання триває 3 с.'},query:'slow eccentric push up 3 seconds technique'},
 plank:{name:'Планка на передпліччях',category:'Кор · стабільність',muscles:'М’язи живота, сідниці; плечовий пояс утримує опору.',why:'Тренує здатність тримати тулуб стабільним без прогину попереку.',setup:'Лікті під плечима, передпліччя на підлозі; стопи приблизно на ширині таза.',steps:['Постав передпліччя на підлогу й випрями ноги, спираючись на носки.','Напруж живіт і сідниці так, щоб плечі, таз і п’яти були приблизно на одній лінії.','Дивись у підлогу, не задирай голову й не піднімай плечі до вух.','Продовжуй спокійно дихати. Не затримуй повітря заради довшого часу.','Як тільки таз провисає або з’являється біль, закінчи підхід і підтверди фактичний час.'],tempo:'Утримуй короткий запланований час із чистою технікою; відпочинок 45 с.',mistakes:['Провисання попереку.','Занадто високо піднятий таз.','Затримка дихання й утримання до втрати позиції.'],easier:'Опусти коліна на підлогу й збережи пряму лінію від плечей до колін.',video:{url:'https://www.youtube.com/watch?v=DjEN3SKl0Eg',title:'Planks For Beginners | Proper Form + 10 Plank Exercises',credit:'Демонстрація планки для початківців',note:'Дивись базову планку на передпліччях; додаткові варіанти з ролика не потрібно додавати до програми.'},query:'forearm plank beginner proper form'},
 highPlank:{name:'Легка планка на прямих руках',category:'Кор · розминка',muscles:'Кор і плечовий пояс.',why:'Готує упор лежачи до віджимань і стрибків у планці.',setup:'Долоні під плечима, руки прямі, стопи на носках.',steps:['Прийми упор лежачи; пальці розведені, навантаження рівномірне на долонях.','Підбери стабільне положення таза, напруж живіт і сідниці.','Дивись униз і дихай; утримуй положення лише протягом запланованого часу розминки.','За втоми опусти коліна на підлогу.'],tempo:'20 с у розминці, без виснаження.',mistakes:['Провалювати таз.','Переносити плечі далеко за кисті без контролю.'],easier:'Планка з колінами на підлозі або упор біля стіни.',query:'high plank straight arms proper form beginner'},
 deadBug:{name:'Мертвий жук — dead bug',category:'Кор · контроль попереку',muscles:'М’язи живота, контроль положення ребер і таза.',why:'Навчає рухати руками й ногами без втрати стабільного положення попереку.',setup:'Ляж на спину. Руки спрямовані до стелі, стегна й коліна зігнуті приблизно під 90°.',steps:['Злегка напруж живіт; поперек не повинен різко відриватися від підлоги.','Повільно опусти праву руку за голову та одночасно випрями ліву ногу до підлоги.','Зупини рух до точки, де поперек починає прогинатися. Не потрібно торкатися підлоги кінцівками.','Поверни руку й ногу назад, потім повтори рух іншою рукою та ногою.','У плані 8 на сторону означає 8 рухів правою рукою та лівою ногою і 8 — лівою рукою та правою ногою; разом 16 рухів.'],tempo:'Повільне випрямлення 2–3 с та контрольоване повернення.',mistakes:['Опускати ногу занадто низько й прогинати поперек.','Рухатися швидко, затримувати дихання.'],easier:'Рухай тільки однією ногою із зігнутим коліном або торкайся п’ятою підлоги, руки нерухомі.',query:'Dead Bug physiotherapy exercise proper form'},
 wheel:{name:'Колесо з колін',category:'Кор · сила',muscles:'Кор; плечі й руки підтримують колесо.',why:'Тренує опір прогину попереку під час руху рук уперед.',setup:'Коліна на комфортній неслизькій поверхні; колесо під плечима.',steps:['Візьми колесо двома руками, напруж живіт і сідниці, злегка опусти ребра.','Повільно викоти колесо лише на коротку відстань уперед.','Зупинися до того, як поперек прогнеться або таз провалиться. Відстань важливіше контролювати, ніж збільшувати.','Напружуючи живіт, поверни колесо назад без ривка.','Починай із 3 чистих повторень. Різкий біль — причина припинити рух.'],tempo:'2–3 с викочування, повільне повернення, 75 с відпочинку.',mistakes:['Викочуватися надто далеко.','Повертатися прогином у попереку чи різким рухом таза.'],easier:'Коротша амплітуда або dead bug замість колеса.',video:{url:'https://www.youtube.com/watch?v=9ZCoAbI7uX0',title:'Ab Wheel For Beginners | Rollout Progression and Extra Exercises',credit:'Minus The Gym',note:'Використовуй тільки короткі викочування з колін. Додаткові складні вправи з ролика до цього плану не входять.'},query:'ab wheel rollout beginner knees short range'},
 lunge:{name:'Зворотні випади',category:'Ноги · таз',muscles:'Квадрицепси, сідниці; рівновага й контроль таза.',why:'Додає контрольовану роботу ніг без зайвих стрибків.',setup:'Стань рівно, стопи приблизно на ширині таза. За потреби притримуйся за стіну.',steps:['Зроби невеликий крок однією ногою назад.','Плавно зігни обидва коліна й опусти таз. Переднє коліно рухається в напрямку носка.','Не потрібно торкатися підлоги заднім коліном; обери комфортну глибину.','Відштовхнися передньою стопою та повернися у стійку.','Виконай таку саму кількість повторень іншою ногою. У полі застосунку вказуй кількість на одну сторону.'],tempo:'Приблизно 2 с униз, контрольований підйом; пауза 60 с.',mistakes:['Ставити стопи на одну вузьку лінію й втрачати рівновагу.','Завалювати переднє коліно всередину.'],easier:'Менший крок і глибина, допомога стіни для рівноваги.',query:'bodyweight reverse lunge beginner proper form'},
 assistedPull:{name:'Підтягування з резинкою',category:'Тяга · спина й руки',muscles:'Найширші м’язи, біцепси та м’язи плечового поясу.',why:'Дозволяє тренувати контрольовану повну амплітуду з поточного рівня.',setup:'Надійна перекладина, ціла резинка. Не ставай на нестійку опору.',steps:['Закріпи петлю на перекладині, обережно розмісти стопу або коліно в нижній петлі відповідно до зручного варіанта.','Візьмися за перекладину хватом приблизно на ширині плечей, стабілізуй плечі й таз.','Без ривка веди лікті вниз і підніми підборіддя над перекладиною.','Плавно опустися до контрольованої нижньої позиції з розігнутими ліктями.','Закінчи із запасом 1–3 повторення. Резинка має допомагати, а не змушувати тебе розгойдуватися.'],tempo:'Плавний підйом і опускання, 120 с між робочими підходами.',mistakes:['Розгойдування та кіпінг.','Неповна амплітуда.','Необережне виймання ноги з натягнутої резинки.'],easier:'Більша допомога резинки або одиночні повторення замість подвійних.',query:'band assisted pull up tutorial no kipping'},
 strictPull:{name:'Строгі підтягування',category:'Тяга · тест сили',muscles:'Спина, біцепси та плечовий пояс.',why:'Окрема ціль — 10 строгих повторень поспіль; робочі підходи й тести розділені.',setup:'Візьмися за перекладину хватом приблизно на ширині плечей. Допомоги резинки немає.',steps:['Почни з контрольованого вису та розігнутих ліктів.','Без поштовху ногами й розгойдування підніми підборіддя над перекладиною.','Плавно повернися до нижньої позиції.','Тест завершується, коли наступний рух потребує ривка або скорочення амплітуди.','Якщо не можеш зробити жодного повторення — запиши 0; не повторюй невдалі спроби.'],tempo:'Контрольований рух; після тесту відпочинок 3–4 хв.',mistakes:['Кіпінг чи підстрибування.','Зараховувати неповні повторення як строгі.'],easier:'Повернися до запланованої роботи з резинкою.',query:'strict pull up proper form no kipping'},
 scapPull:{name:'Лопаткові підтягування',category:'Тяга · контроль лопаток',muscles:'М’язи, які стабілізують лопатки й плечовий пояс.',why:'Тренує контроль початку підтягування.',setup:'Візьмися за перекладину; ноги можуть частково спиратися на підлогу або надійну опору.',steps:['Розігни лікті й залиш їх прямими протягом руху.','Плавно відведи плечі від вух, злегка опускаючи лопатки. Тіло підніметься лише на кілька сантиметрів.','На мить утримай контроль, потім плавно повернися.','Не намагайся підтягнути підборіддя до перекладини: це невеликий рух лопатками.'],tempo:'Повільний короткий рух, без ривків.',mistakes:['Згинати лікті замість того, щоб рухати лопатками.','Падати у вис або тягнути плече через біль.'],easier:'Часткова опора стоп або невелика амплітуда.',query:'scapular pull ups straight arms tutorial'},
 hang:{name:'Активний вис',category:'Тяга · хват і лопатки',muscles:'Хват і плечовий пояс.',why:'Допомагає утримувати стабільне положення плечей на перекладині.',setup:'Надійна перекладина, комфортний хват; за потреби ноги допомагають утримувати вагу.',steps:['Візьмися за перекладину й залиш лікті прямими.','Злегка відведи плечі від вух, не підтягуйся й не розгойдуйся.','Утримуй короткий заданий час і дихай.','Постав ноги на надійну опору, перенеси на них вагу тіла й лише тоді відпусти перекладину.'],tempo:'10–20 с у робочому блоці, 15 с у легкій розминці.',mistakes:['Висіти до повної втрати хвата.','Терпіти суглобовий біль у плечі.'],easier:'Залиш більшу частину ваги на ногах.',query:'active hang shoulders tutorial beginner'},

тини грудей, повертай плавно. Не використовуй пошкоджену резинку.":"Опціонально, лише за доброго відновлення. Надійне кріплення до перекладини, стійка позиція на колінах. Тягни до верхньої частини грудей, повертай плавно. Не використовуй пошкоджену резинку.","Підтягування завершені; відпочинь 3–5 хв до рівного дихання. Ця пауза не входить у 22 хв.":"Підтягування завершені; відпочинь 3–5 хв до відновлення рівного дихання. Ця пауза не входить у 22 хв.","Опціонально після комплексу. Контрольований крок назад, коліно передньої ноги за носком. У полі — повторення на одну ногу; виконай стільки ж на другу.":"Опціонально після комплексу. Контрольований крок назад, коліно передньої ноги спрямоване в той самий бік, що й носок. У полі — повторення на одну ногу; виконай стільки ж на другу.","1 хв ходьба й вирівнювання дихання → 1 хв розтягнення литок по 30 с → 1 хв грудні м’язи по 30 с → 1 хв легка мобільність стегон і спокійне дихання. Без болю, пружинення й силового розтягування.":"1 хв ходьби й вирівнювання дихання → 1 хв розтягування литок (по 30 с на ногу) → 1 хв розтягування грудних м’язів (по 30 с на бік) → 1 хв легких рухів стегнами й спокійного дихання. Без болю, пружинення й силового розтягування.","Опціонально. Опускання близько 3 с, залишай щонайменше 2 повторення в запасі. Якщо після комплексу 6 важкі — від підвищеної стійкої опори або пропусти.":"Опціонально. Опускання близько 3 с, залишай щонайменше 2 повторення в запасі. Якщо після комплексу 6 повторень даються важко — від підвищеної стійкої опори або пропусти.","RPE 3–4. Можеш говорити повними реченнями. При сильній втомі після Пн/Ср пропусти день D. Без додаткових стрибків чи силового комплексу.":"RPE 3–4. Можеш говорити повними реченнями. За сильної втоми після Пн/Ср пропусти день D. Без додаткових стрибків чи силового комплексу.","20 кіл плечима, 10 поворотів грудного відділу на бік, грудні 30 с, литки по 30 с, стегна 2 хв.":"20 кругових рухів плечима; 10 поворотів тулуба на кожен бік; розтягування грудних м’язів — 30 с, литок — по 30 с на ногу; легкі рухи стегнами — 2 хв.","Опціонально: безпечна стійка опора для виходу нагору; контрольоване опускання 3–5 с. Без опори чи контролю заміни повторенням із резинкою та затримкою вгорі 2–3 с. Не стрибай на турнік і не опускайся до виснаження.":"Опціонально: безпечна стійка опора для виходу нагору; контрольоване опускання 3–5 с. Без опори чи контролю заміни повторенням із резинкою та затримкою вгорі 2–3 с. Не стрибай на перекладину і не опускайся до виснаження."};
if(S.active){for(const step of S.active.steps){step.name=COACH_COPY_EDITS[step.name]??step.name;step.note=COACH_COPY_EDITS[step.note]??step.note;if(step.technique)step.technique=step.technique.map(t=>COACH_COPY_EDITS[t]??t);}}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').classList.remove('visible'),4500)}
function save(){globalThis.forgeState=S;if(recoveryRaw&&!recoveryExported){toast('Спочатку експортуй збережену пошкоджену копію.');return;}try{if(legacyLogStorage){const full=JSON.stringify(S);if(full.length>3500000)throw Error('storage-limit');localStorage.setItem(STORAGE_KEY,full);storageFailed=false;return;}if(logsDirty&&!persistLogShards()){const hadIndex=!!localStorage.getItem(LOG_INDEX_KEY);if(hadIndex)throw Error('log-storage');for(const log of S.logs)localStorage.removeItem('forge8.log.'+log.id);legacyLogStorage=true;const full=JSON.stringify(S);if(full.length>3500000)throw Error('storage-limit');localStorage.setItem(STORAGE_KEY,full);logsDirty=false;logsStructureDirty=false;dirtyLogIds.clear();storageFailed=false;return;}const snapshot={...S,logs:[]},payload=JSON.stringify(snapshot);if(payload.length>3500000)throw Error('storage-limit');localStorage.setItem(STORAGE_KEY,payload);storageFailed=false;}catch{storageFailed=true;toast('Не вдалося зберегти зміни. Експортуй щоденник і звільни місце на пристрої.');}}
function autoSave(now=Date.now()){if(S.active){const index=S.logs.findIndex(l=>l.id===S.active.id);const log=workoutLog(S.active,index>=0?S.logs[index]:{},now);if(index>=0)S.logs[index]=log;else S.logs.push(log);markLogsChanged(log.id,index<0);}save();}
function dateFor(day,week=S.week){const d=new Date(S.start+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+(week-1)*7+day);return d;}
function dateLabel(day,week=S.week){return dateFor(day,week).toLocaleDateString('uk-UA',{day:'numeric',month:'long',timeZone:'UTC'});}
function schedule(){return [0,2,4,...(S.frequency===4?[6]:[])];}
function isDone(day,week=S.week){const planned=dateFor(day,week).toISOString().slice(0,10),cycleId='forge8:'+S.start;return S.logs.some(l=>l.completed&&(l.cycleId?l.cycleId===cycleId&&l.plannedDate===planned:l.week===week&&l.day===day&&l.date>=S.start));}
function fmtDate(s){return new Date(s+'T12:00:00Z').toLocaleDateString('uk-UA',{day:'numeric',month:'long',timeZone:'UTC'});}
const btn=(a,label,css='secondary',extra='')=>`<button class="${css}" data-action="${a}" ${extra}>${label}</button>`;
function heading(title,subtitle,eyebrow=''){return `<div class="page-heading">${eyebrow?`<span class="eyebrow">${esc(eyebrow)}</span>`:''}<h1 tabindex="-1">${title}</h1><p>${esc(subtitle)}</p></div>`;}
function controls(){return `<div class="toolbar"><div class="segmented">${[3,4].map(n=>btn('frequency',`${n} дні`,S.frequency===n?'selected':'',`data-frequency="${n}" aria-pressed="${S.frequency===n}"`)).join('')}</div><select class="week-select" id="week-select" aria-label="Тиждень програми">${WEEKS.map((_,i)=>`<option value="${i+1}" ${S.week===i+1?'selected':''}>Тиждень ${i+1} / 8</option>`).join('')}</select></div>`;}
function dayStrip(){return `<div class="week-days">${DAYS.map((d,i)=>`<button class="day ${schedule().includes(i)?'training':''} ${i===6?'optional-day':''} ${S.selectedDay===i?'selected':''} ${isDone(i)?'done':''}" data-action="day" data-day="${i}" aria-label="${d}${i===6?' — опційне заняття':''} ${dateLabel(i)}" aria-pressed="${S.selectedDay===i}"><small>${SHORT[i]}${i===6?' · опц.':''}</small><strong>${dateFor(i).getUTCDate()}</strong><i></i></button>`).join('')}</div>`;}

function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function coachPanel(){const p=pullPlan(S.week,S.selectedDay===4?4:0);return `<section class="card"><span class="eyebrow">ТРЕНЕР ПІДТЯГУВАНЬ · РІВЕНЬ ${p.level+1}/5</span><h3>${p.mode==='foundation'?'Підготовчий рівень · 0 строгих':p.max+' строгих · '+(p.mode==='band'?'із резинкою':'без допомоги')}</h3><p class="accent">${p.mode==='foundation'?'Легка тяга резинки':'Наступні підходи'}: ${p.targets.join(' / ')}</p><p class="small muted">${esc(p.reason)}</p><a class="text-button" href="#profile">Оновити рівень, резинку або вправу для кора →</a><p class="small muted">8 тижнів — перший цикл. Мета 10 строгих може потребувати продовження.</p></section>`;}
function progressMetrics(state=S){const logs=state.logs||[];let strict=state.coach?.strictMax||0,assisted=state.coach?.assistedMax??PROFILE.assisted,best=null,push=state.coach?.pushMax??16;const times=[];for(const l of logs){strict=Math.max(strict,l.pull||0);push=Math.max(push,l.push||0);for(const e of l.pullEntries||[])if(e.assistance==='band'&&e.quality==='full'&&l.started>=(state.coach?.assistedAt||0))assisted=Math.max(assisted,e.reps||0);if(l.completed&&l.standard&&l.plannedComplex?.rounds===5&&l.plannedComplex.reps.join(',')==='10,10,5,10'&&l.rounds===5&&l.complexSeconds!=null){times.push(l);best=best===null?l.complexSeconds:Math.min(best,l.complexSeconds);}}let missed=0;const today=dateISO();for(let w=1;w<=8;w++)for(const d of [0,2,4]){const dt=dateFor(d,w).toISOString().slice(0,10);if(dt<today&&!isDone(d,w))missed++;}return {strict,assisted,best,times,missed,push};}
function sparkline(values,label){if(!values.length)return `<p class="small muted">${label}: ще немає контрольних результатів.</p>`;const min=values.reduce((a,b)=>Math.min(a,b),Infinity),max=values.reduce((a,b)=>Math.max(a,b),-Infinity),points=values.map((n,i)=>`${10+i*280/Math.max(1,values.length-1)},${65-(n-min)*50/Math.max(1,max-min)}`).join(' ');return `<p class="small muted">${label} · ${values.join(' → ')}</p><svg role="img" aria-label="${esc(label)}: ${values.join(', ')}" viewBox="0 0 300 80" style="width:100%;height:80px"><polyline fill="none" stroke="var(--lime)" stroke-width="3" points="${points}"/>${points.split(' ').map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="var(--lime)"/>`).join('')}</svg>`;}
function progressPanel(){const m=progressMetrics(),tests=S.logs.filter(l=>l.pull!=null),goals=[1,3,5,7,10];return `<section class="card"><h3>Рекорди та досягнення</h3><div class="log-grid"><div><strong>${m.strict}</strong><small>строгі · максимум</small></div><div><strong>${m.push}</strong><small>віджимання · максимум</small></div><div><strong>${m.best===null?'—':clock(m.best*1000)}</strong><small>5 стандартних раундів</small></div></div><p class="small muted">З резинкою: ${m.assisted} · найбільший записаний підхід. Порівнюй лише однакову резинку, хват і розміщення.<br>Пропущено основних занять за календарем: ${m.missed}. За потреби зміни дату початку програми у профілі.</p><div class="milestones">${goals.map(n=>`<span class="label-chip">${m.strict>=n?'✓':'○'} ${n} строгих</span>`).join('')}<span class="label-chip">${m.times.length?'✓':'○'} Перші 5 раундів</span><span class="label-chip">${m.best!==null&&m.best<=1320?'✓':'○'} ≤22:00</span></div>${sparkline(tests.map(l=>l.pull),'Контрольні строгі підтягування')}${sparkline(m.times.map(l=>l.complexSeconds),'5 стандартних раундів · секунди (менше — краще)')}<p class="status-note">Полегшені комплекси не входять у рекорд стандартних 5 раундів. Робочі одиночні не замінюють тест максимуму.</p></section>`;}
function sessionPreview(a,limit=3){const rows=a.rows.filter(r=>!['warm','cool','prep','instruction'].includes(r.kind)&&!/^\d\./.test(r.name)),pull=rows.filter(r=>r.mainPull);let shownPull=false;return rows.flatMap(r=>{if(!r.mainPull)return [r];if(shownPull)return [];shownPull=true;const targets=pull.map(p=>p.reps),sets=targets.every(n=>n===targets[0])?targets.length+' × '+targets[0]:targets.join(' / ');return [{...r,sets}];}).slice(0,limit).map(r=>`<div class="preview-row"><span>${esc(r.name)}</span><strong>${esc(r.sets)}</strong></div>`).join('');}
function home(){const w=WEEKS[S.week-1],a=session(S.week,S.selectedDay,S.frequency),done=schedule().filter(d=>isDone(d)).length,weekLogs=S.logs.filter(l=>l.week===S.week&&(l.cycleId?l.cycleId==='forge8:'+S.start:l.date>=S.start)),active=S.active&&S.active.phase!=='summary';return `<div class="priority-screen home-screen">`+(recoveryRaw?`<section class="card note"><strong>Потрібно зберегти резервну копію.</strong><p>Знайдено пошкоджений знімок. Експортуй його перед будь-яким новим збереженням.</p>${btn('export-recovery','Завантажити резервну копію','secondary')}</section>`:'')+`<section class="home-primary" aria-label="План і початок заняття">${controls()}${dayStrip()}${active?`<aside class="home-resume"><div><strong>Незавершене заняття</strong><span>${esc(S.active.title)} · тиждень ${S.active.week}</span></div>${btn('resume','Продовжити','primary')}</aside>`:''}<section class="card quick-session"><div class="quick-session-heading"><span class="eyebrow">${DAYS[S.selectedDay]} · ${dateLabel(S.selectedDay)}</span><span class="small muted">${a.minutes} хв</span></div><h1>${esc(a.title)}</h1><p class="quick-session-meta">${a.type==='rest'?'Легке відновлення':`Розминка ${clock((a.warmup?.seconds||600)*1000)} · основна частина · заминка`}</p><div class="quick-session-preview">${sessionPreview(a,active?2:3)}</div><div class="quick-session-actions">${btn('start',`${icon('play')} ${a.type==='rest'?'Почати відновлення':'Почати заняття'}`,active?'secondary':'primary',`data-day="${S.selectedDay}"`)}<a href="#plan" class="secondary">План ${icon('arrow')}</a></div><p class="quick-session-note">${icon('check')} Підходи зберігаються автоматично</p></section></section><details class="card support-panel"><summary>Прогрес тижня й поради тренера</summary><div class="row spread small muted"><span>Тиждень ${S.week} / 8 · ${w.tag}</span><span>${done}/${schedule().length} занять</span></div><div class="progress-track"><span style="width:${100*done/schedule().length}%"></span></div><div class="metric-grid"><div class="metric"><strong>${S.logs.reduce((n,l)=>Math.max(n,l.push||0),S.coach?.pushMax??16)}</strong><small>віджимання / макс.</small></div><div class="metric"><strong>${S.logs.reduce((n,l)=>Math.max(n,l.pull||0),S.coach?.strictMax??0)}</strong><small>строгі / макс.</small></div><div class="metric"><strong>${Math.round(weekLogs.reduce((n,l)=>n+l.minutes,0))}</strong><small>хв цього тижня</small></div></div>${coachPanel()}<div class="note"><strong>Твоя ціль:</strong> 5 × (10 / 10 / 5 / 10) за 22 хв.<br>Підтягування — окремо. Залишай 1–2 повторення в запасі.</div></details>${installCard()}</div>`;}
function helpButton(name,note=''){return `<button class="exercise-help-button" data-action="exercise-help" data-name="${esc(name)}" data-note="${esc(note)}" aria-label="Як виконувати: ${esc(name)}" title="Техніка вправи">?</button>`;}
function exerciseRows(rows){let lastSection=null;return rows.map(r=>{const section=r.section&&r.section!==lastSection?`<div class="exercise-section">${esc(r.section)}</div>`:'';if(r.section)lastSection=r.section;return section+`<div class="exercise"><div class="exercise-heading"><strong>${esc(r.name)}</strong>${helpButton(r.name,r.note)}</div><div class="dose">${esc(r.sets)}</div><div class="rest-label">Відпочинок: ${esc(r.rest)}</div><p>${esc(r.note)}</p>${r.parts?.length?`<div class="mini-plan-list">${r.parts.map(part=>`<div><span>${esc(part.name)}</span><strong>${clock(part.seconds*1000)}</strong>${helpButton(part.name,part.note)}</div>`).join('')}</div>`:''}</div>`;}).join('');}
function plan(){const w=WEEKS[S.week-1],day=S.selectedDay,a=session(S.week,day,S.frequency);return `<div class="priority-screen plan-screen">${heading('План тренувань','Обери день. Вправи й навантаження — у подробицях.')}${controls()}${dayStrip()}<section class="card quick-session selected-plan"><div class="quick-session-heading"><span class="eyebrow">${DAYS[day]} · ${dateLabel(day)}</span><span class="small muted">${a.minutes} хв</span></div><h1>${esc(a.title)}</h1><div class="quick-session-preview">${sessionPreview(a)}</div>${btn('start',`${icon('play')} Почати це заняття`,'primary',`data-day="${day}"`)}<details class="plan-exercises"><summary>Усі вправи, підходи й техніка</summary>${exerciseRows(a.rows)}</details></section><details class="card support-panel"><summary>Інші дні й прогресія 8 тижнів</summary><div class="week-tabs">${WEEKS.map((_,i)=>btn('week',`ТИЖДЕНЬ<strong>${i+1}</strong>`,'week-tab'+(i+1===S.week?' selected':''),`data-week="${i+1}"`)).join('')}</div><span class="eyebrow">${w.tag}</span><h2>${w.name}</h2><p class="small muted">Пн — сила підтягувань, Ср — основний комплекс, Пт — силова витривалість, Нд — необов’язкове відновлення.</p>${DAYS.map((d,i)=>{if(i===day)return '';const a=session(S.week,i,S.frequency);return `<details class="card plan-day"><summary><div><h3>${d} · ${isDone(i)?'✓ ':''}${esc(a.title)}</h3><small>${dateLabel(i)} · ${a.minutes} хв</small></div><span class="accent">+</span></summary>${btn('start',`${icon('play')} Почати це заняття`,'secondary',`data-day="${i}"`)}${exerciseRows(a.rows)}</details>`;}).join('')}</details><details class="card support-panel"><summary>Повні таблиці, завантаження й правила</summary><div class="button-pair"><a class="secondary" href="#fullplan">Повні таблиці</a>${btn('download-plan',`${icon('download')} План .md`)}</div><p class="small muted">Якщо навантаження завелике — залишайся на попередньому тижні. У силовому занятті можна зменшити повторення й відзначити полегшення.</p></details></div>`;}

function openExerciseHelp(name,note=''){const dialog=$('#exercise-dialog'),a=S.active,key=exerciseHelpKey(name),h=EXERCISES[key]||{name,category:'Рух із твого плану',muscles:'',why:'Виконуй цей підготовчий рух легко, без болю та виснаження.',setup:'Займи стійку комфортну позицію й підготуй місце.',steps:note?note.split(/[.!?]+\s+/).filter(Boolean):['Виконуй рух плавно у комфортній амплітуді.','Дихай вільно та зберігай контроль положення тіла.'],mistakes:['Ривки, затримка дихання або рух через біль.'],easier:'Зменш амплітуду чи інтенсивність; за потреби пропусти рух.',query:name+' exercise technique'};helpFocusName=name;

function runner(){if(adaptActivePullPreparation(S.active)){autoSave();toast('Невиконану тягову роботу полегшено. Попередні записи збережено.');}if(updateActiveRests(S.active))autoSave();if(pendingWorkout)return warmupPreview(pendingWorkout);const a=S.active;if(!a)return heading('Готовий рухатися?','Обери заняття і проходь його крок за кроком.')+`<div class="card"><h2>${session(S.week,S.selectedDay,S.frequency).title}</h2><p class="muted small">${DAYS[S.selectedDay]} · тиждень ${S.week}<br>Автоматичний щоденник та таймери відпочинку.</p>${btn('start',`${icon('play')} Почати заняття`,'primary',`data-day="${S.selectedDay}"`)}</div><a class="secondary" href="#plan">Обрати інше заняття</a>`;
 if(a.phase==='summary')return summary();
 const step=currentStep(a),log=workoutLog(a,S.logs.find(l=>l.id===a.id)||{}),isComplex=step.kind==='complex',isTimed=['warm','cool','prep','hold','timed','interval'].includes(step.kind),n=a.repOverride??(isComplex?Math.max(0,step.reps[a.complexIndex%4]-(a.complexRepProgress||0)):step.target),paused=a.pausedAt!==null;

 else if(isComplex){const move=a.complexIndex%4,round=Math.floor(a.complexIndex/4)+1;body=`<section class="card runner-card"><span class="eyebrow">КОМПЛЕКС · РАУНД ${round} / ${step.rounds}</span><div class="clock compact" id="live-clock">${clock(step.target*1000-complexMilliseconds(a))}</div><div class="round-dots">${Array.from({length:step.rounds},(_,i)=>`<span class="round-dot ${i<a.laps.length?'done':i===round-1?'current':''}">${i<a.laps.length?'✓':i+1}</span>`).join('')}</div><div class="move-list">${MOVES.map((_,i)=>`<span class="${i<move?'done':i===move?'current':''}"></span>`).join('')}</div><div class="exercise-heading runner-help-title"><h1>${MOVES[move]}</h1>${helpButton(MOVES[move],step.technique?.[move]||step.note)}</div>${repPicker(n)}<p class="muted small">Залишилося ${step.reps[move]-(a.complexRepProgress||0)} / ${step.reps[move]} повторень.<br>Можна відзначати серії 6+4 або 5+5.</p><label class="modification"><input type="checkbox" id="modified" ${a.modified?'checked':''}>Полегшив рух / зробив заміну</label>${a.complexStarted===null?btn('start-block',`${icon('play')} Запустити комплекс`,'primary'):btn('confirm-complex',`${icon('check')} Записати повторення`,'primary')}<details class="runner-technique"><summary>Техніка й орієнтир темпу</summary><p>${esc(step.technique?.[move]||step.note)}</p><p class="small accent">Орієнтир завершення раунду ${round}: ${clock(round*264000)} сумарно для фінальних 5 раундів.</p><p class="runner-warning">Таймер не зупиняється між вправами. Підтягувань у цьому блоці немає.</p></details>${a.complexStarted!==null?btn('end-complex','Завершити комплекс раніше','text-button'):''}</section>`;}
 else if(step.miniTimer)body=miniSession(a,step);
 else body=`<section class="card runner-card"><span class="eyebrow">${step.miniTimer?esc(step.groupTitle)+' · ВПРАВА '+step.miniIndex+' / '+step.miniCount:step.kind==='test'?'КОНТРОЛЬНИЙ ТЕСТ':step.set?`ПІДХІД ${step.set} / ${step.sets}`:'ПІДГОТОВКА ТА ВІДНОВЛЕННЯ'}</span><div class="exercise-heading runner-help-title"><h1>${esc(step.name)}</h1>${helpButton(step.name,step.note)}</div>${step.section?`<span class="label-chip">${esc(step.section)}</span>`:''}${step.optional?'<span class="label-chip">ОПЦІОНАЛЬНО · МОЖНА ПРОПУСТИТИ</span>':''}${isTimed?`<div class="clock ${step.miniTimer?'mini-clock':''}" id="live-clock" role="timer" aria-label="Залишок часу вправи">${clock(step.target*1000-(a.stageStarted===null?0:Math.min(step.target*1000,Date.now()-a.stageStarted)))}</div><p class="muted small" id="interval-label">${step.kind==='interval'?'1 хв швидко → 1 хв легко':step.kind==='hold'?'Тримай положення без прогину попереку':'Дихай спокійно. Не пропускай техніку.'}</p>`:repPicker(n,step.testMax??200)}${!isTimed?`<p class="muted small">${step.kind==='test'?'Введи свій технічний максимум. 0 — коректний результат.':'Фактичні повторення'+(step.perSide?' на одну сторону':'')+' · план '+step.target+(step.targetMax&&step.targetMax!==step.target?'–'+step.targetMax:'')}</p><label class="modification"><input type="checkbox" id="modified" ${a.modified?'checked':''}>${step.assistance?'Неповна амплітуда / втрата техніки':'Полегшив рух / зробив заміну'}</label>`:''}${pullControls(a,step)}${isTimed&&a.stageStarted===null?btn('start-block',`${icon('play')} ${step.miniTimer?'Почати вправу':'Запустити таймер'}`,'primary'):btn('confirm-step',`${icon('check')} ${isTimed?(step.miniTimer?'Наступна раніше':'Блок виконано'):'Підхід виконано'}`,'primary')}<div class="button-pair runner-secondary-controls">${btn('skip-step','Пропустити','secondary')}${btn('pause','Пауза','secondary')}</div><details class="runner-technique"><summary>Техніка й підказки</summary><p>${esc(step.note)}</p></details>${ let diaryLimit=30;function diary(){const all=S.logs.slice().sort((a,b)=>b.started-a.started),logs=all.slice(0,diaryLimit),finished=all.reduce((n,l)=>n+(l.completed?1:0),0),minutes=Math.round(all.reduce((n,l)=>n+l.minutes,0)),rounds=all.reduce((n,l)=>n+l.rounds,0);return `<div class="priority-screen diary-screen">${heading('Щоденник','Останні заняття — першими. Усе записується автоматично.')}<details class="card support-panel diary-analytics"><summary>Прогрес, рекорди й регулярність</summary>${progressPanel()}<div class="metric-grid"><div class="metric"><strong>${finished}</strong><small>повних занять</small></div><div class="metric"><strong>${minutes}</strong><small>хв роботи</small></div><div class="metric"><strong>${rounds}</strong><small>раундів</small></div></div><div class="card"><h3>Регулярність за 8 тижнів</h3><div class="history-chart">${WEEKS.map((_,i)=>{const n=all.filter(l=>l.week===i+1&&l.completed&&(l.cycleId?l.cycleId==='forge8:'+S.start:l.date>=S.start)).length;return `<div><i style="height:${Math.min(65,5+n*15)}px"></i><small>${i+1}</small></div>`}).join('')}</div></div></details>${logs.length?logs.map(l=>`<details class="card log-card"><summary><div><h3>${esc(l.title||((l.programRevision===PROGRAM_REVISION?session(l.week,l.day,S.frequency).title:SHORT[l.day]+' · попередня програма')))}</h3><span class="log-meta">${fmtDate(l.date)} · тиждень ${l.week} · ${l.completed?'повне':'часткове'}${l.standard?' · стандарт':''}</span></div><span class="accent">${l.rounds} раундів</span></summary><div class="log-grid"><div><strong>${l.minutes}</strong><small>хв</small></div><div><strong>${l.pull??'—'}</strong><small>строгі підтягування</small></div><div><strong>${l.pain??'—'}</strong><small>біль / 10</small></div></div>${complexPlanSummary(l)}${pullSummary(l)}<p class="log-text">${esc(l.actual)}</p>${l.notes?`<p class="small muted">${esc(l.notes)}</p>`:''}${btn('delete-log','Видалити запис','text-button',`data-id="${esc(l.id)}"`)}</details>`).join(''):`<div class function profile(){return `<div class="priority-screen profile-screen">${heading('Налаштування','Зміни потрібні поля й натисни «Зберегти».')}<div class="form-action-bar"><button class="primary" type="submit" form="profile-form">Зберегти налаштування</button></div><section class="card settings-card"><form id="profile-form"><h3>Поточний рівень</h3><div class="form-row"><label>Строгі підтягування<input name="strictMax" type="number" min="0" max="50" value="${pullPlan(S.week,0).max}" required></label><label>Максимум віджимань<input name="pushMax" type="number" min="0" max="200" value="${S.coach?.pushMax??16}" required></label></div><div class="form-row"><label>Повні з резинкою<input name="assistedMax" type="number" min="0" max="50" step="1" value="${S.coach?.assistedMax??0}" required></label><label>Доступна висота, %<input name="assistedROM" type="number" min="0" max="100" step="1" value="${S.coach?.assistedROM??60}" required></label></div><p class="small muted">60% висоти = частковий рух, 0 повних повторень. Для робочих одиночних потрібні 2 повні з резинкою.</p><label>Резинка, її розміщення та хват<input name="band" maxlength="160" value="${esc(S.band)}" placeholder="Зелена, 3 см, під стопою"></label><p class="small muted">Оновлюй максимум після контрольної спроби. Зміна допомоги починає нову прогресію.</p><details class="settings-group"><summary>Розклад і вправа для кора</summary><label>Перший понеділок програми<input name="start" type="date" value="${S.start}" required></label><label>Занять на тиждень<select name="frequency"><option value="3" ${S.frequency===3?'selected':''}>3 — Пн, Ср, Пт</option><option value="4" ${S.frequency===4?'selected':''}>4 — плюс опційна Нд</option></select></label><label>Вправа для кора<select name="core"><option value="wheel" ${S.coach?.core!=='deadbug'?'selected':''}>Колесо з колін, коротка амплітуда</option><option value="deadbug" ${S.coach?.core==='deadbug'?'selected':''}>Мертвий жук — полегшення</option></select></label><p class="small muted">Чоловік · 31 рік · 82 кг · 183 см. Старт: 16 віджимань, 0 повних підтягувань із резинкою, орієнтовно 60% висоти руху.</p></details><details class="settings-group" ${S.warmupPrefs?.pain?'open':''}><summary>${S.warmupPrefs?.pain?'Є біль — запуск заняття призупинено':'Обмеження, розминка та інвентар'}</summary><label>Втома зараз<select name="warmFatigue"><option value="normal">Звичайна</option><option value="high" ${S.warmupPrefs?.fatigue==='high'?'selected':''}>Надмірна — лише легка активація</option></select></label>${[['warmPain','Зараз є біль',S.warmupPrefs?.pain],['lowImpact','Підготовка без стрибків',S.warmupPrefs?.lowImpact],['mergeWalk','Неділя — лише прогулянка; перші 5 хв є розминкою',S.warmupPrefs?.mergeWalk],['warmBar','Є надійна перекладина',S.warmupPrefs?.equipment?.bar!==false],['warmBand','Є зелена резинка',S.warmupPrefs?.equipment?.band!==false]].map(([name,label,on])=>`<label class="check-row"><input type="checkbox" name="${name}" ${on?'checked':''}><span>${label}</span></label>`).join('')}<p class="small muted">При болю не тренуй відповідний рух через силу. Зупини або зміни активність; за потреби звернися до фахівця. Вибір без стрибків змінює підготовку, а не стандарт комплексу.</p></details><details class="settings-group"><summary>Звук і активний екран</summary><label class="check-row"><input name="keepScreen" type="checkbox" ${S.keepScreen!==false?'checked':''}><span>Утримувати екран активним, якщо це підтримує Safari/iOS</span></label><p class="status-note" id="profile-screen-status">${screenStatus()}</p><label class="check-row"><input name="sound" type="checkbox" ${S.sound?'checked':''}><span>Звуковий відлік і завершення таймерів</span></label>${btn('test-sound','Перевірити звуковий сигнал','secondary','type="button"')}<p class="status-note">За 3, 2 і 1 секунду — по одному сигналу. Після завершення — сигнал переходу. Гучність регулюй кнопками телефона; у фоні iOS може затримувати звук.</p></details></form></section><details class="card support-panel settings-card"><summary>Встановлення на iPhone й оновлення</summary><p class="small muted">Safari → «Поширити» → «На Початковий екран» → «Додати».</p>${btn('install','Показати інструкцію','secondary')}<p class="status-note" id="offline-status">${offlineReady?'Офлайн-файли збережені на пристрої.':'Для офлайн-режиму на GitHub потрібні всі файли з ZIP.'}</p>${btn('update-app','Перевірити оновлення','text-button')}</details><details class="card support-panel"><summary>Щоденник і резервні копії</summary><p class="small muted">Записи зберігаються в тому самому браузері за тією самою адресою. Для іншої адреси імпортуй копію.</p><div class="button-pair">${btn('export','Експорт у JSON','secondary')}${btn('import','Імпорт із JSON','secondary')}</div></details>${location.hostname.endsWith('chatgpt.site')?`<details class="card support-panel"><summary>Файли для GitHub</summary>${btn('get-html','Завантажити index.html','secondary')}${btn('get-package','Завантажити повний ZIP','text-button')}</details>`:''}<a href="#guide" class="text-button">Техніка й відновлення →</a></div>`;}
function table(rows){return `<div class="table-wrap"><table><thead><tr><th>Вправа</th><th>Підходи × повторення</th><th>Відпочинок</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}<small>${esc(r.note)}</small>${r.parts?.length?`<small>${r.parts.map(part=>esc(part.name)+' — '+clock(part.seconds*1000)).join('<br>')}</small>`:''}</td><td>${esc(r.sets)}</td><td>${esc(r.rest)}</td></tr>`).join('')}</tbody></table></div>`;}
function fullplan(){return heading('Повна програма.','Усі 8 тижнів: вправи, підходи, відпочинок.')+`<div class="button-pair">${btn('print','Друк / PDF')}${btn('download-plan','Завантажити .md')}</div><div class="full-plan">${WEEKS.map((w,i)=>`<h2>Тиждень ${i+1} — ${w.name}</h2><p class="small muted">Вт, Чт, Сб — відпочинок. Нд — необов’язкова легка ходьба й мобільність. Підтягування адаптуються за журналом; це поточна рекомендація.</p>${([0,2,4,6]).map(d=>`<article class="card"><h3>${DAYS[d]} / ${session(i+1,d,4).title}</h3>${table(session(i+1,d,4).rows)}</article>`).join('')}`).join('')}${GUIDE.map(g=>`<div class="card"><h3>${g.title}</h3><p class="small muted">${g.text}</p></div>`).join('')}</div>`;}
function route(){let name=location.hash.slice(1);if(name==='timer')name='train';return ['home','plan','train','diary','guide','profile','fullplan'].includes(name)?name:'home';}
function render(){globalThis.forgeState=S;const name=route();$('#app').innerHTML=({home,plan,train:runner,diary,guide,profile,fullplan})[name]();$('#nav').innerHTML=[['home','Сьогодні'],['plan','План'],['train','Заняття'],['diary','Щоденник'],['guide','Тренер']].map(([n,title])=>`<a href="#${n}" class="${name===n||name==='fullplan'&&n==='plan'?'active':''}" ${name===n?'aria-current="page"':''}>${icon(n==='train'?'timer':n)}<span>${title}</span></a>`).join('');updateLive();}
function go(name){if(route()===name)render();else location.hash=name;}
function currentReps(){const value=Number($('#actual-reps')?.value??0);return Number.isInteger(value)&&numberOK(value,0,200)?value:null;}
function activeChanged(){autoSave();render();if(currentStep(S.active)?.miniTimer)requestAnimationFrame(()=>$('#exercise-live')?.focus({preventScroll:true}));}
async function unlockAudio(){try{if(!audioCtx||audioCtx.state==='closed'){if(navigator.audioSession){try{navigator.audioSession.type='playback';}catch{}}audioCtx=new (window.AudioContext||window.webkitAudioContext)();}if(audioCtx.state!=='running')await audioCtx.resume();return audioCtx;}catch{return null;}}
async function signal(type='finish',force=false){if(!S.sound&&!force)return false;try{navigator.vibrate?.(type==='start'||type==='countdown'?40:[120,80,120]);}catch{}const ctx=await unlockAudio();if(!ctx)return false;try{const now=ctx.currentTime,tones=type==='start'?[[0,660,.08]]:type==='countdown'?[[0,740,.12]]:[[0,880,.15],[.23,1100,.15],[.46,880,.23]];for(const [delay,hz,duration] of tones){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.001,now+delay);gain.gain.exponentialRampToValueAtTime(type==='start'?.08:.2,now+delay+.015);gain.gain.exponentialRampToValueAtTime(.001,now+delay+duration);osc.connect(gain);gain.connect(ctx.destination);osc.onended=()=>{osc.disconnect();gain.disconnect();};osc.start(now+delay);osc.stop(now+delay+duration+.02);}return true;}catch{return false;}}
function miniRunner(a,step,log){const group=a.steps.map((s,i)=>({...s,cursor:i})).filter(s=>s.miniTimer&&s.kind===step.kind&&s.groupTitle===step.groupTitle),next=a.steps[a.cursor+1],paused=a.pausedAt!==null;
 const items=group.map(s=>{const active=s.cursor===a.cursor,past=s.cursor<a.cursor,entry=a.entries.filter(e=>e.cursor===s.cursor&&!['rest','repeat'].includes(e.kind)).at(-1),done=past&&entry?.completed;return `<li class="mini-exercise ${active?'current':past?'past':'upcoming'}" ${active?'aria-current="step"':''} data-mini-cursor="${s.cursor}"><span class="mini-number" aria-label="${done?'Виконано':past?'Пропущено':'Вправа '+s.miniIndex}">${done?'✓':past?'−':s.miniIndex}</span><span class="mini-copy"><strong>${esc(s.name)}</strong><small>${clock((past?(entry?.seconds||0):s.target)*1000)}</small></span>${helpButton(s.name,s.note)}</li>`;}).join('');
 const runnerTop=`<div class="mini-runner-top"><span>${SHORT[a.day]} · тиждень ${a.week}</span>${btn('toggle-sound',S.sound?'Звук: увімкнено':'Звук: вимкнено','text-button sound-button',`id="sound-toggle" aria-pressed="${S.sound}" aria-label="Звук таймера"`)}${btn('exit-runner','Зберегти й вийти','text-button mini-leave')}</div><div class="spinner" role="progressbar" aria-label="Прогрес розминки" aria-valuemin="0" aria-valuemax="${step.miniCount}" aria-valuenow="${step.miniIndex-1}"><span id="warm-progress" style="width:${100*(step.miniIndex-1)/step.miniCount}%"></span></div>`;
 return `<div class="mini-runner">${runnerTop}<section class="card mini-session"><div class="mini-session-heading"><div><span class="eyebrow">${step.miniIndex} / ${step.miniCount} · ${clock(step.groupSeconds*1000)} загалом</span><h1>${esc(step.groupTitle)}</h1></div>${helpButton(step.name,step.note)}</div><div class="mini-active"><div class="mini-active-title"><span>ЗАРАЗ · ${step.miniIndex}</span><h2 id="exercise-live" tabindex="-1" aria-live="polite">${esc(step.name)}</h2></div><div class="clock mini-clock" id="live-clock" role="timer" aria-label="Залишок часу вправи">${clock(step.target*1000-(a.stageStarted===null?0:Math.max(0,Date.now()-a.stageStarted)))}</div><div class="mini-timer-track"><span id="mini-progress" style="width:0%"></span></div><p class="mini-technique">${esc(step.note)}${step.manual?'<br><strong>Не поспішай: після 00:00 заверши підхід і підтвердь виконання.</strong>':''}</p>${paused?btn('resume-workout','Продовжити','primary'):a.stageStarted===null?btn('start-block',icon('play')+' Почати вправу','primary'):`<div class="mini-controls">${btn('confirm-step',icon('check')+(step.manual?' Підхід завершено':' Наступна вправа'),'primary')} ${btn('pause','Пауза','secondary')}${btn('repeat-mini','Повторити','secondary')}${btn('skip-step','Пропустити','secondary')}</div>`}</div><p class="mini-next small muted">Далі: ${next?.miniTimer&&next.groupTitle===step.groupTitle?esc(next.name):'завершення підготовки'}</p><ol class="mini-grid" style="grid-template-rows:repeat(${Math.ceil(group.length/2)},minmax(0,1fr))" aria-label="Усі вправи блоку">${items}</ol><p class="mini-journal">Підходи підтверджуй сам. Сигнал означає завершення часового вікна.</p></section></div>`;}
function timerRemaining(a,step,now){if(step?.warmupGate&&a.warmupRestUntil)return a.warmupRestUntil-now;if(a.phase==='rest')return a.restUntil===null?null:a.restUntil-now;if(a.phase!=='exercise'||!step)return null;if(step.kind==='complex')return a.complexStarted===null||a.complexEnded!==null?null:step.target*1000-complexMilliseconds(a,now);return a.stageStarted===null?null:step.target*1000-(now-a.stageStarted);}
function warnCountdown(a,step,now){if(a.pausedAt!==null||document.visibilityState!=='visible')return;const remaining=timerRemaining(a,step,now),digit=remaining!==null&&remaining>0?Math.ceil(remaining/1000):0,key=a.cursor+':'+a.phase;
 const el=$('#live-clock');el?.classList.toggle('ending',digit>=1&&digit<=3);if(digit<1||digit>3)return;
 if(!a.countdownCue||a.countdownCue.key!==key||digit<a.countdownCue.last){a.countdownCue={key,last:digit};save();signal('countdown');}
}
function screenStatus(){if(S.keepScreen===false)return 'Екран: автоблокування дозволене';if(wakeError)return 'Safari не підтвердив утримання екрана';if(!navigator.wakeLock)return 'Екран: утримання не підтримується цим Safari';return wakeLock&&!wakeLock.released?'Екран залишається активним':'Екран: очікуємо активації Safari';}
function updateScreenStatus(){for(const id of ['#screen-status','#profile-screen-status'])if($(id))$(id).textContent=screenStatus();}
async function keepAwake(){if(S.keepScreen===false||document.visibilityState!=='visible'||!navigator.wakeLock||wakePending||(wakeLock&&!wakeLock.released))return;wakePending=true;try{const lock=await navigator.wakeLock.request('screen');if(S.keepScreen===false||document.visibilityState!=='visible'){await lock.release();return;}wakeLock=lock;wakeError=false;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;updateScreenStatus();if(document.visibilityState==='visible'&&S.keepScreen!==false)setTimeout(keepAwake,1000);});}catch{wakeError=true;}finally{wakePending=false;updateScreenStatus();}}
function releaseAwake(force=false){if(!force&&S.keepScreen!==false&&document.visibilityState==='visible'){keepAwake();return;}const lock=wakeLock;wakeLock=null;lock?.release().catch(()=>{});updateScreenStatus();}
function autoNextMini(now){const a=S.active,step=currentStep(a),deadline=a.stageStarted+step.target*1000;if(!confirmStep(a,0,deadline))return;a.entries[a.entries.length-1].autoTimed=true;const next=currentStep(a);if(a.phase==='exercise'&&next?.miniTimer&&next.groupTitle===step.groupTitle)a.stageStarted=now;autoSave(now);signal();render();requestAnimationFrame(()=>$('#exercise-live')?.focus({preventScroll:true}));}

function updateLive(){const a=S.active;if(!a)return;if($('#warm-rest-clock'))$('#warm-rest-clock').textContent=clock(Math.max(0,(a.warmupRestUntil||0)-Date.now()));const step=currentStep(a);const now=Date.now();
 if($('#help-live-complex')&&a.complexStarted!==null){const cs=a.steps.find(x=>x.kind==='complex');$('#help-live-complex').textContent='Час комплексу: '+clock(Math.max(0,cs.target*1000-complexMilliseconds(a,now)));}
 warnCountdown(a,step,now);if(step?.warmupGate&&a.warmupRestUntil&&now>=a.warmupRestUntil&&!a.warmupRestSignaled){a.warmupRestSignaled=true;autoSave();signal();}
 if(a.phase==='exercise'&&step?.miniTimer&&!step.manual&&a.pausedAt===null&&a.stageStarted!==null&&now>=a.stageStarted+step.target*1000&&document.visibilityState==='visible'){autoNextMini(now);return;}
 if(a.phase==='exercise'&&step?.kind==='complex'&&a.complexStarted!==null&&a.complexEnded===null&&complexMilliseconds(a,now)>=step.target*1000){a.complexEnded=a.complexStarted+step.target*1000;a.phase='complex-end';a.repOverride=0;autoSave(now);signal();render();return;}

 if($('#live-clock')){const left=timerRemaining(a,step,now);$('#live-clock').textContent=clock(Math.ceil(Math.max(0,left??step.target*1000)/1000)*1000);}
 if(a.phase==='rest'){const ready=now>=a.restUntil,button=$('[data-action="rest-next"]');if(button)button.textContent=ready?(betweenExercises(a)?'Почати наступну вправу':'Почати наступний підхід'):'Продовжити раніше';if($('#rest-note'))$('#rest-note').textContent=ready?'Відпочинок завершено. Продовжуй, коли готовий.':'Рекомендована пауза '+step.rest+' с. Наступна вправа почнеться після твого підтвердження.';}
 if(a.phase==='rest'&&now>=a.restUntil&&!a.restSignaled){a.restSignaled=true;autoSave(now);signal();toast(betweenExercises(a)?'Відпочинок завершено. Можеш починати наступну вправу.':'Відпочинок завершено. Можеш починати наступний підхід.');}
 if(a.phase==='exercise'&&a.stageStarted!==null&&step?.kind!=='complex'&&(!step?.miniTimer||step.manual)&&now-a.stageStarted>=step.target*1000&&!a.blockSignaled){a.blockSignaled=true;autoSave(now);signal();toast(step.miniTimer?'Час вправи завершено. Підтвердь виконання й переходь далі.':'Час блоку завершено. Підтвердь виконання.');}
 if($('#warm-progress')&&step?.miniTimer){const done=(step.miniIndex-1)+(a.stageStarted===null?0:Math.min(1,(now-a.stageStarted)/(step.target*1000)));$('#warm-progress').style.width=(100*done/step.miniCount)+'%';$('.mini-runner .spinner')?.setAttribute('aria-valuenow',String(Math.min(step.miniCount,Math.floor(done))));}
 if($('#mini-progress')&&step?.miniTimer)$('#mini-progress').style.width=(a.stageStarted===null?0:Math.min(100,100*(now-a.stageStarted)/(step.target*1000)))+'%';
 if($('#interval-label')&&step?.kind==='interval'&&a.stageStarted!==null){const sec=Math.min(step.target,Math.floor((now-a.stageStarted)/1000));$('#interval-label').textContent=sec>=step.target?'Інтервали завершені':`Цикл ${Math.floor(sec/120)+1} / ${step.cycles} · ${sec%120<60?'швидка ходьба · RPE 5':'легка ходьба · RPE 2–3'}`;}
}
function toNext(){const a=S.active;if(!a||a.phase!=='rest')return;const seconds=Math.max(0,Math.round((Date.now()-a.restStarted)/1000));a.entries.push({cursor:a.cursor,name:'Відпочинок',kind:'rest',set:1,reps:null,seconds,target:currentStep(a).rest,at:Date.now(),modified:false,completed:seconds>=currentStep(a).rest});a.restUntil=null;a.restStarted=null;a.restSignaled=false;a.phase='exercise';moveForward(a,Date.now());activeChanged();}
function pauseWorkout(){const a=S.active;if(complexRunning(a)){toast('Комплекс рахується без пауз. Для зупинки заверши спробу.');return;}a.pausedAt=Date.now();a.status='paused';autoSave();releaseAwake();render();}
function resumeWorkout(){const a=S.active;if(a.pausedAt!==null){const delta=Date.now()-a.pausedAt;a.pausedMs+=delta;if(a.stageStarted!==null)a.stageStarted+=delta;if(a.restUntil!==null)a.restUntil+=delta;if(a.restStarted!==null)a.restStarted+=delta;a.pausedAt=null;a.status='active';autoSave();}keepAwake();render();}
function stopComplexEarly(){const a=S.active;if(a.complexStarted===null)return;if(!confirm('Завершити комплекс? Час і підтверджені вправи збережуться як часткова спроба.'))return;a.complexEnded=Date.now();a.phase='complex-end';a.repOverride=0;autoSave();render();}
function recordPartial(){const a=S.active,n=currentReps(),step=currentStep(a),move=a.complexIndex%4,progress=a.complexRepProgress||0,remaining=step.reps[move]-progress;
 if(n===null||n>remaining){toast('Введи від 0 до '+remaining+' повторень, виконаних до зупинки часу.');return;}
 if(a.modified)a.complexStandard=false;
 if(n>0){const complete=progress+n===step.reps[move];a.entries.push({cursor:a.cursor,name:MOVES[move],kind:'complex',set:Math.floor(a.complexIndex/4)+1,reps:n,target:step.reps[move],at:a.complexEnded,modified:a.modified,completed:complete,partial:!complete,series:true,reportedAfter:true});if(complete){a.complexIndex++;if(a.complexIndex%4===0)a.laps.push(complexMilliseconds(a));}}
 a.complexRepProgress=0;finishCurrentStep(a,Date.now());activeChanged();}
function pullControls(a,step){if(step.assistance==='band-partial')return '<p class="small muted">Частковий рух · повні підтягування: 0</p>';if(!step.assistance||step.kind==='test')return '';const negative=step.assistance==='negative';const options=negative?[['negative','Негативне опускання'],['band-hold','З резинкою + 2–3 с вгорі']]:[['band','З резинкою'],['none','Без резинки']];return `<div class="pull-controls"><label>Фактична допомога<select id="assistance">${options.map(([v,t])=>`<option value="${v}" ${(a.assistanceOverride??step.assistance)===v?'selected':''}>${t}</option>`).join('')}</select></label>${negative?`<label>Опускання, с (необов’язково)<input id="eccentric-seconds" type="number" inputmode="decimal" min="0" max="20" step="0.5" value="${a.eccentricOverride??''}" placeholder="3–5"></label>`:''}</div>`;}
function complexPlanSummary(l){if(!l.plannedComplex)return '';const p=l.plannedComplex,planned=p.rounds*p.reps.reduce((s,n)=>s+n,0);return `<p class="small muted">План комплексу: ${p.rounds} × (${p.reps.join(' / ')}) · ${planned} повторень · ліміт ${clock(p.cap*1000)}<br>Підтверджено: <span class="accent">${l.complexTotalReps??0} повторень</span>${l.goalMet?'<br><strong class="accent">Фінальна ціль 175 повторень за ≤22 хв досягнута</strong>':''}</p>`;}
function pullSummary(l){const entries=l.pullEntries||l.entries?.filter(e=>e.assistance)||[];if(!entries.length)return '';const count=help=>entries.filter(e=>e.assistance===help&&e.quality!=='incomplete').reduce((n,e)=>n+(e.reps||0),0),neg=entries.filter(e=>e.assistance==='negative'),bad=entries.some(e=>e.quality==='incomplete');return `<p class="small muted"><strong>Окремий блок підтягувань</strong><br>З резинкою: ${count('band')} · без резинки: ${count('none')}${count('band-hold')?' · з резинкою + затримка: '+count('band-hold'):''} ${entries.some(e=>e.kind==='hold')?'<br>Утримання вгорі: '+entries.filter(e=>e.kind==='hold').map(e=>e.seconds+' с').join(' / '):''} ${bad?'· є повторення неповної амплітуди':''}${entries.some(e=>e.assistance==='band-partial')?'<br>Часткові рухи: '+entries.filter(e=>e.assistance==='band-partial').reduce((n,e)=>n+(e.reps||0),0)+' (не повні підтягування)':''}${neg.length?'<br>Негативні: '+count('negative')+'; опускання: '+neg.map(e=>e.eccentricSeconds?e.eccentricSeconds+' с':'не виміряно').join(' / '):''}</p>`;}
function planMarkdown(){let t='# FORGE / 8 — мобільний тренер\n\nПрофіль: чоловік, 31 рік, 82 кг, 183 см.\nЦіль: 5 × (10 / 10 / 5 / 10) за 22 хв. Підтягування — окремо.\n';WEEKS.forEach((w,i)=>{t+=`\n## Тиждень ${i+1} — ${w.name}\n\n| День | Вправа | Підходи × повторення | Відпочинок |\n|---|---|---|---|\n`;DAYS.forEach((d,j)=>session(i+1,j,4).rows.forEach(r=>{t+=`| ${d}${j===6?' (необов’язково)':''} | ${r.name} | ${r.sets} | ${r.rest} |\n`;if(r.parts)r.parts.forEach(part=>{t+=`| ${d} | ↳ ${part.name} | ${clock(part.seconds*1000)} | — |\n`;});}));[0,2,4,6].forEach(j=>session(i+1,j,4).rows.forEach(r=>{if(r.note)t+=`\n- ${DAYS[j]}${j===6?' (необов’язково)':''} — ${r.name}: ${r.note}\n`;}));});GUIDE.forEach(g=>t+=`\n## ${g.title}\n\n${g.text}\n`);t+='\n## Готовність до тесту\n\n'+READINESS.map(r=>'- [ ] '+r).join('\n');return t;}
