ho:"Hollow — основа преса «рука до стопи» і захисту попереку.",
pk:"Планка стабілізує корпус для віджимань і стрибків у планці.",

const WU=[
WS("Кола руками",30,"10 кіл вперед і 10 кіл назад","Стань прямо, ноги на ширині плечей. Тримай руки прямими й роби великі кола: 10 кіл вперед, потім 10 кіл назад. Це розігріває плечі."),
WS("Кола кистями",20,"10 обертів в один бік і 10 в інший","Зчепи пальці в замок перед собою й обертай кисті: 10 разів в один бік, 10 в інший. Готує зап'ястя до віджимань."),
WS("Кола тазом",20,"5 кіл в один бік і 5 в інший","Ноги на ширині плечей, руки на поясі. Роби повільні великі кола тазом, ніби крутиш обруч: 5 кіл в один бік, 5 в інший."),
WS("Кішка-корова",40,"8 повторів","Стань на четвереньки: долоні під плечима, коліна під тазом. На видиху вигни спину вгору, як кішка. На вдиху прогни спину вниз і подивись уперед, як корова. Це один повтор. Рухайся повільно, приблизно по 2–3 секунди на кожен рух. Розігріває спину й поперек."),
WS("Присідання",40,"15 повторів","Ноги на ширині плечей. Сідай назад, ніби на стілець, спина пряма, коліна по лінії стоп. Потім вставай. 15 повторів у спокійному темпі."),
WS("Повільні віджимання",40,"8 повторів","Звичайні віджимання, але повільно: 2 секунди вниз, 1 секунда вгору. 8 повторів. Це розігрів, не тренування. Можна з колін."),
WS("Вис на турніку",20,"1 вис на 20 с","Повисни на турніку на прямих руках, плечі трохи опущені від вух. Тримай 20 с (можна 2 рази по 10 с). Якщо важко, стань на опору й частково розвантаж руки."),
WS("Підскоки на місці",50,"50 с без зупинки (приблизно 80 підскоків)","Легко підстрибуй на носках, невисоко, ніби крутиш скакалку. Дихай рівно. Це піднімає пульс."),
WS("Стрибки з присяду на півсили",40,"6 стрибків з паузами між ними","Присядь неглибоко й підстрибни невисоко, приземляйся м'яко на носки. Роби 6 стрибків з паузами між ними, не в повну силу. Це підготовка колін до основних стрибків.")

const CD=[
WS("Ходьба і дихання",60,"60 с спокійної ходьби","Ходи спокійно, руки вільно, дихай носом. Пульс має поступово знизитись."),
WS("Розтяжка грудей",40,"2 рази по 20 с (кожна рука)","Стань боком до стіни. Витягни руку вбік і притисни долонею до стіни на рівні плеча. Повільно повертай корпус від стіни, поки не відчуєш розтяг у грудях. 20 секунд одна рука, 20 секунд інша."),

WS("Розтяжка стегна",40,"2 рази по 20 с (кожна нога)","Стоячи на одній нозі (тримайся за стіну), зігни іншу й візьмись за стопу, притискаючи п'яту до сідниці. Коліна поруч. 20 секунд на кожну ногу."),
WS("Нахил уперед",40,"1 раз, утримуй 40 с","Стань рівно, ноги разом або трохи розставлені. Повільно нахились уперед і тягнись руками до підлоги, коліна можна трохи зігнути. Не пружинь, просто втримуй положення."),

const HOW={pu:"Упор лежачи, руки трохи ширше плечей. Тіло пряме, як дошка. Опускайся, поки груди майже торкнуться підлоги, лікті під кутом близько 45° до тулуба. Потім відштовхнись угору.",

ng:"Зістрибни або стань на опору так, щоб підборіддя було над турніком. Повільно, за 5 секунд, опустись до повного звисання. Потім знову вгору (стрибком або з опори).",

wh:"Стань на коліна, колесо під плечима. Втягни живіт і повільно котись вперед, поки поперек не почне прогинатись, потім повертайся. Довжина ходу вказана в назві вправи. Поперек не прогинай.",
ho:"Лежачи на спині: підніми плечі й прямі ноги над підлогою, поперек притиснутий до підлоги. Тримай. Якщо поперек відривається від підлоги, зігни ноги.",
pk:"Упор на передпліччях. Тіло — пряма лінія від п'ят до голови, таз не піднімай і не провисай.",
em:"Таймер перемикає хвилини. У кожну хвилину зроби вказані повтори якомога швидше, залишок хвилини відпочивай.",

 return `<div class="hd"><span>${W?'Розминка':'Заминка'} · 5 хв</span><button class="sb" onclick="tsnd()">${SND?'🔊':'🔇'}</button></div>
 <div class="mu">Крок ${ses.wi+1} з ${A.length}</div>
 <div class="cd"><div class="exh"><div><h2>${x.n}</h2><div class="mu">${x.s} с</div></div><button class="hp" onclick="help()">?</button></div><div class="tv" id="tv">${f(x.s*1000)}</div><div style="font:700 22px/1.25 Inter,sans-serif;margin:8px 0">${x.d}</div>${ses.hp?`<div class="hx">${x.h}</div>`:''}</div>
 <div class="cd">${A.map((y,i)=>`<div class="${i==ses.wi?'hl':'mu'}">${i<ses.wi?'✓ ':''}${y.n} — ${y.s} с</div>`).join('')}</div>
 <button class="bt wide" onclick="stp(${ses.wi+1})">Далі</button><button class="ch wide" onclick="${W?'skipW()':'fin()'}">${W?'Пропустити розминку':'Пропустити заминку'}</button><button class="ch wide" onclick="quit()">✕ Вийти</button>`}
function tMenu(){const D=ses.D,all=D.it.every((x,i)=>ses.res[i]);
 return hd()+`<h2 style="margin:6px 0">${D.t}</h2><div class="mu">Обери вправу</div>${D.it.map((x,i)=>`<button class="mi ${ses.res[i]?'dn':''}" onclick="pick(${i})"><b>${ses.res[i]?'✓ ':''}${x.n}</b><div class="mu">${x.s}${ses.res[i]?' · зроблено: '+ses.res[i].join(' / '):''}</div></button>`).join('')}
 <button class="bt wide" onclick="cool()">${all?'Усе зроблено — до заминки':'Завершити — до заминки'}</button>`}
function tEx(){const x=ses.x,i=ses.si,t=ses.tg[i],u=x.u?' с':'';
 const rows=ses.tg.map((g,j)=>j<i?`<div class="sr d"><b>${j+1}</b><span class="v">${x.mx?'—':g}</span><span class="v">${ses.dn[j]}</span><span class="ck">✓</span></div>`:`<div class="sr ${j==i?'c':'u'}"><b>${j+1}</b><span class="v">${x.mx?'макс':g}</span><span class="v ${j==i?'vv':''}">${j==i?ses.val:'–'}</span><span class="ck"></span></div>`).join('');
 return hd()+strip()+`<div class="cd"><div class="exh"><span class="ib">${ses.c+1}</span><div><h2>${x.n}</h2><div class="mu">${GL[x.k]||''}</div></div><button class="hp" onclick="help()">?</button></div>${ses.hp?`<div class="hx">${HOW[x.k]}</div>`:''}
 <div class="rc">⏱ відпочинок ${f(x.rs*1000)}</div>
 <div class="sr h"><span>Підх.</span><span>План${u}</span><span>Факт</span><span></span></div>${rows}
 ${!x.mx&&i==0&&t!=x.reps?`<div class="mu">За планом ${x.reps}${u}, скориговано за попередніми вправами</div>`:`<div class="mu">${x.s}</div>`}
 ${x.u?(ses.hd==1||ses.hd==3?`<div class="mu" style="text-align:center">${ses.hd==1?'Готуйся: утримання почнеться після сигналу':'Тримай!'}</div><div class="tv" id="tv"></div>`:`<button class="bt wide" onclick="hold()">▶ Старт ${t} с (5 с на підготовку)</button>`):''}
 <div class="stp"><button onclick="bump(-${x.u?5:1})">−</button><span class="val vv">${ses.val}</span><button onclick="bump(${x.u?5:1})">+</button></div>
 <button class="bt wide" onclick="ok()">Зробив ✓${i<x.sets-1||x.mx?' — запустити відпочинок':''}</button></div>
 <div class="wy">Чому: ${WHY[x.k]}</div>`}
function tRest(){return hd()+`<div class="mu">Відпочинок</div><div class="big">${ses.nx}</div>${ses.note?`<div class="mu">${ses.note}</div>`:''}<div class="tv" id="tv">${ses.rd?'00:00':''}</div>${ses.rd?'<div class="big" style="text-align:center">Час! Починай</div>':''}<button class="bt wide" onclick="nextS()">${ses.af=='ex'?'Почати підхід':'До списку вправ'}</button>`}
function tCirc(){const x=ses.x,L=ses.lp,k=Math.min(L.length+1,x.rd);
 return hd()+`<div class="mu">${x.n}</div><h2>${ses.run?`Раунд ${k} з ${x.rd}`:`${x.rd} ${P(x.rd,'раунд','раунди','раундів')}, ліміт ${x.cap} хв`}</h2>
 <div class="cd"><b>Один раунд:</b> ${x.rr[0]} віджимань → ${x.rr[1]} стрибків у планці → ${x.rr[2]} ${P(x.rr[2],'стрибок','стрибки','стрибків')} з присяду → ${x.rr[3]} повторів преса (рука до стопи)<div class="mu">Темп: ≈ ${f(x.cap*60000/x.rd)} на раунд</div></div><button class="ch" onclick="help()">? Як виконувати</button>${ses.hp?`<div class="hx">${HOW.cir}</div>`:''}
 <div class="tv" id="tv">00:00</div>${L.length?`<div class="mu" style="text-align:center">${L.map((v,i)=>f(i?v-L[i-1]:v)).join(' · ')}</div>`:''}
 ${ses.run?`<button class="bt wide" onclick="cl()">Раунд ${k} готовий</button><button class="ch wide" onclick="cf()">Зупинити</button>`:`<button class="bt wide" onclick="cs()">▶ Старт</button><button class="ch wide" onclick="back()">← До списку вправ</button>`}`}
function tEm(){const x=ses.x,mi=TM&&TM.m=='e'?Math.max(0,TM.min):0,r=x.rr;
 return hd()+`<div class="mu">${x.n}</div><h2>${ses.run?`Хвилина ${mi+1} з ${x.em}`:`${x.em} ${P(x.em,'хвилина','хвилини','хвилин')}`}</h2>
 <div class="cd">${ses.run?(mi%2==0?`${r[0]} стрибків у планці`:`${r[1]} ${P(r[1],'стрибок','стрибки','стрибків')} з присяду + ${r[2]} повторів преса`):`Непарна хвилина: ${r[0]} стрибків у планці. Парна хвилина: ${r[1]} ${P(r[1],'стрибок','стрибки','стрибків')} з присяду + ${r[2]} повторів преса. Решту хвилини відпочивай.`}</div>
 <button class="ch" onclick="help()">? Як виконувати</button>${ses.hp?`<div class="hx">${HOW.em} Стрибок у планці: з упору лежачи підстрибни обома ногами до грудей. Стрибок з присяду: присядь і вистрибни, стопи відриваються від підлоги.</div>`:''}<div class="tv" id="tv">${ses.run?'':'01:00'}</div>
 ${ses.run?`<button class="ch wide" onclick="exDone()">Завершити достроково</button>`:`<button class="bt wide" onclick="es()">▶ Старт</button><button class="ch wide" onclick="back()">← До списку вправ</button>`}`}
function tDone(){const D=ses.D;return `<h1>Тренування завершено</h1><div class="cd">${D.it.map((x,i)=>ses.res[i]?`<div><b>${x.n}</b>: ${ses.res[i].join(' / ')}</div>`:'').join('')||'Нічого не записано'}</div><div class="mu">Результати додано в щоденник.</div><button class="bt wide" onclick="endS()">Готово</button>`}

render();
</script></body></html>
